name: botscore

x-app-environment: &app-environment
  DATABASE_URL: postgresql://inspector:${POSTGRES_PASSWORD}@postgres:5432/inspector
  NODE_ENV: production
  NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
  RATE_LIMIT_SALT: ${RATE_LIMIT_SALT}
  TRUST_PROXY_HEADERS: "true"
  CHROME_EXECUTABLE_PATH: /usr/bin/chromium
  AUDIT_CONCURRENCY: ${AUDIT_CONCURRENCY:-2}
  AUDIT_CACHE_TTL_SECONDS: ${AUDIT_CACHE_TTL_SECONDS:-21600}
  AUDIT_RETRY_LIMIT: ${AUDIT_RETRY_LIMIT:-2}
  AUDIT_JOB_TIMEOUT_SECONDS: ${AUDIT_JOB_TIMEOUT_SECONDS:-300}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
  AUDIT_FETCH_TIMEOUT_MS: ${AUDIT_FETCH_TIMEOUT_MS:-15000}
  AUDIT_RENDER_TIMEOUT_MS: ${AUDIT_RENDER_TIMEOUT_MS:-20000}
  AUDIT_MAX_RESPONSE_BYTES: ${AUDIT_MAX_RESPONSE_BYTES:-2097152}
  ENABLE_OPENROUTER_NARRATIVE: ${ENABLE_OPENROUTER_NARRATIVE:-false}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
  HUBSPOT_PRIVATE_APP_TOKEN: ${HUBSPOT_PRIVATE_APP_TOKEN:-}
  LISTMONK_URL: ${LISTMONK_URL:-}
  LISTMONK_USERNAME: ${LISTMONK_USERNAME:-}
  LISTMONK_PASSWORD: ${LISTMONK_PASSWORD:-}
  LISTMONK_REPORT_TEMPLATE_ID: ${LISTMONK_REPORT_TEMPLATE_ID:-}

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: inspector
      POSTGRES_USER: inspector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspector -d inspector"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      target: worker
    environment: *app-environment
    command: ["node", "node_modules/tsx/dist/cli.mjs", "scripts/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
